[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pretix-gocardless"
version = "0.1.0.dev3"
description = "Experimental GoCardless SEPA payment provider for pretix"
authors = [{name = "Spotstone UG (haftungsbeschränkt)"}]
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3"]
classifiers = ["Development Status :: 2 - Pre-Alpha"]

[project.entry-points."pretix.plugin"]
pretix_gocardless = "pretix_gocardless"

[tool.setuptools.packages.find]
include = ["pretix_gocardless*"]

[tool.setuptools.package-data]
pretix_gocardless = ["templates/**/*.html", "templates/**/*.txt"]
