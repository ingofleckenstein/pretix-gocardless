[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pretix-gocardless"
version = "0.1.0.dev0"
description = "Experimental GoCardless SEPA payment provider for pretix"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3"]
license = {text = "MIT"}
classifiers = ["Development Status :: 2 - Pre-Alpha", "License :: OSI Approved :: MIT License"]

[project.entry-points."pretix.plugin"]
pretix_gocardless = "pretix_gocardless:PretixGoCardlessApp"

[tool.setuptools.packages.find]
include = ["pretix_gocardless*"]
